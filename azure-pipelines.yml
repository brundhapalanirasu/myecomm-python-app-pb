trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

stages:
# ---------------------------------------------------------
# STAGE 1: Package your Python App files into an Artifact
# ---------------------------------------------------------
- stage: Build
  displayName: 'Package Application'
  jobs:
  - job: BuildJob
    steps:
    - task: ArchiveFiles@2
      displayName: 'Zip application source'
      inputs:
        rootFolderOrFile: '$(System.DefaultWorkingDirectory)'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'
        replaceExistingArchive: true

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Package to Pipeline'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'drop'
        publishLocation: 'Container'

# ---------------------------------------------------------
# STAGE 2: Securely Deploy the Package directly to VM1
# ---------------------------------------------------------
- stage: Deploy
  displayName: 'Deploy Tier'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: DeployWeb
    displayName: 'Target Web Servers'
    # This hooks directly into the Environment tracking system
    environment:
      name: 'myecomm-vm-environment'
      resourceType: VirtualMachine
    strategy:
      runOnce:
        deploy:
          steps:
          - task: ExtractFiles@1
            displayName: 'Extract code artifact'
            inputs:
              archiveFilePatterns: '$(Pipeline.Workspace)/drop/$(Build.BuildId).zip'
              destinationFolder: '/home/azureuser/app'
              cleanDestinationFolder: false

          - task: CmdLine@2
            displayName: 'Install Dependencies and Boot Application'
            inputs:
              script: |
                cd /home/azureuser/app
                pip3 install -r requirements.txt --break-system-packages
                pkill -f app.py || true
                nohup python3 app.py > output.log 2>&1 &
