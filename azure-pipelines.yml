trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

stages:
# ---------------------------------------------------------
# STAGE 1: Package your Python App files into an Artifact
# ---------------------------------------------------------
- stage: Build
  displayName: 'Package Application'
  jobs:
  - job: BuildJob
    steps:
    - task: ArchiveFiles@2
      displayName: 'Zip application source'
      inputs:
        rootFolderOrFile: '$(System.DefaultWorkingDirectory)'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'
        replaceExistingArchive: true

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Package to Pipeline'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'drop'
        publishLocation: 'Container'

# ---------------------------------------------------------
# STAGE 2: Securely Deploy the Package directly to VM1
# ---------------------------------------------------------
- stage: Deploy
  displayName: 'Deploy Tier'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: DeployWeb
    displayName: 'Target Web Servers'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    # This downloads the packaged zip file we created in the Build Stage
    - task: DownloadBuildArtifacts@0
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: 'drop'
        downloadPath: '$(Pipeline.Workspace)'

    # This routes the deployment directly through your existing Deployment Group
    - task: DeploymentGroupPhase@1
      displayName: 'Execute on VM Group'
      inputs:
        DeploymentGroupName: 'myecomm-vm-group'
        Tags: 'web'
        DeploymentGroupTargetPattern: '*'
      # Inside the VMs, execute these exact extraction and startup tasks
      # The target path has been adjusted to /home/azureuser to ensure zero permission errors
        ConnectedServiceNameSelector: 'ConnectedServiceName'
        ScriptType: 'inline'
        InlineScript: |
          mkdir -p /home/azureuser/app
          cp $(Pipeline.Workspace)/drop/*.zip /home/azureuser/app/
          cd /home/azureuser/app
          unzip -o *.zip || true
          pip3 install -r requirements.txt --break-system-packages
          pkill -f app.py || true
          nohup python3 app.py > output.log 2>&1 &
