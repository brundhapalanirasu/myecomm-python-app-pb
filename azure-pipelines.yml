trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

stages:
# ---------------------------------------------------------
# STAGE 1: Package your Python App files into an Artifact
# ---------------------------------------------------------
- stage: Build
  displayName: 'Package Application'
  jobs:
  - job: BuildJob
    steps:
    - task: ArchiveFiles@2
      displayName: 'Zip application source'
      inputs:
        rootFolderOrFile: '$(System.DefaultWorkingDirectory)'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'
        replaceExistingArchive: true

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Package to Pipeline'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'drop'
        publishLocation: 'Container'

# ---------------------------------------------------------
# STAGE 2: Securely Deploy the Package directly to your VM
# ---------------------------------------------------------
- stage: Deploy
  displayName: 'Deploy Tier'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: DeployWeb
    displayName: 'Target Web Servers'
    steps:
    - task: DownloadBuildArtifacts@0
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: 'drop'
        downloadPath: '$(Pipeline.Workspace)'

    - task: CmdLine@2
      displayName: 'Run Deployment Tasks'
      inputs:
        script: |
          echo "Preparing application deployment..."
          mkdir -p /home/azureuser/app
          cp $(Pipeline.Workspace)/drop/*.zip /home/azureuser/app/ 2>/dev/null || true
          cd /home/azureuser/app
          unzip -o *.zip 2>/dev/null || true
          pip3 install -r requirements.txt --break-system-packages
          pkill -f app.py || true
          nohup python3 app.py > output.log 2>&1 &
          echo "Deployment tasks triggered successfully."
