# Python package
# Create and test a Python package on multiple Python versions.
# Add steps that analyze code, save the dist with the build record, publish to a PyPI-compatible index, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/python

trigger:
- main

pool:
  vmImage: ubuntu-latest

strategy:
  matrix:
    Python311:
      python.version: '3.11'

steps:
- task: UsePythonVersion@0
  inputs:
    versionSpec: '$(python.version)'
  displayName: 'Use Python $(python.version)'

- script: |
    python -m pip install --upgrade pip
    pip install -r requirements.txt
  displayName: 'Install dependencies'

- task: AzureCLI@2
  displayName: 'Deploy Flask App to VMSS'
  inputs:
    azureSubscription: 'azure-vmss-conn'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      az vmss run-command invoke --resource-group RG-User05 --name vm-set-pb --instance-ids 0 --command-id RunShellScript --scripts "echo 'from flask import Flask; app = Flask(__name__); @app.route(\"/\")\ndef home(): return \"E-commerce App Running\"\nif __name__ == \"__main__\": app.run(host=\"0.0.0.0\", port=80)' > /home/azureuser/app.py && pkill -f app.py || true && sudo python3 /home/azureuser/app.py > /dev/null 2>&1 &"
