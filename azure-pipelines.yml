# Python package
# Create and test a Python package on multiple Python versions.
# Add steps that analyze code, save the dist with the build record, publish to a PyPI-compatible index, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/python

trigger:
- main

pool:
  vmImage: ubuntu-latest

strategy:
  matrix:
    Python38:
      python.version: '3.8'
    Python39:
      python.version: '3.9'
    Python310:
      python.version: '3.10'
    Python311:
      python.version: '3.11'

steps:
- task: UsePythonVersion@0
  inputs:
    versionSpec: '$(python.version)'
  displayName: 'Use Python $(python.version)'

- script: |
    python -m pip install --upgrade pip
    pip install -r requirements.txt
  displayName: 'Install dependencies'
- task: AzureVMsScaleSetDeployment@1
      displayName: 'Deploy Flask App to VMSS'
      inputs:
        azureSubscription: 'azure-vmss-conn'
        action: 'Update'
        vmssName: 'vm-set-pb'
        customScriptsDirectory: '$(System.DefaultWorkingDirectory)'
        customScript: |
          cd /home/azureuser
          sudo apt-get update || true
          sudo apt-get install -y python3-flask python3-pip || true
          sudo python3 app.py &

